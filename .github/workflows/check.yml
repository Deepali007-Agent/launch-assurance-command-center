name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate_demo.py
      - run: python scripts/generate_logistics_demo.py
      - run: python scripts/quality_checks.py
      - run: python scripts/check_public_demo.py
      - run: python scripts/benchmark_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-benchmark
          path: |
            quality/
            benchmark/
